<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0HX6JSW32K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-0HX6JSW32K");

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login — Trevqio Agency</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFBF3; --ink:#231A33; --coral:#FF6B4A; --coral-dark:#E8502F;
    --sky:#2FA9D6; --sky-tint:#E4F5FB; --sun:#FFC94A;
    --line:#EFE6D6; --ink-soft:#5B5468; --red:#D64545; --red-tint:#FCEAEA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6; min-height:100vh; display:flex; flex-direction:column;}
  header.site{padding:20px 28px; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-size:1.15rem; font-weight:700; text-decoration:none; color:var(--ink);}
  .brand img{height:30px; width:30px; border-radius:9px; object-fit:cover;}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .card{width:100%; max-width:420px; background:#fff; border:2px solid var(--ink); border-radius:22px; padding:36px 32px; position:relative;}
  .card::before{content:"Portal"; position:absolute; top:-14px; left:28px; background:var(--sun); color:var(--ink); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.78rem; padding:5px 14px; border-radius:100px;}
  h1{font-family:'Baloo 2',sans-serif; font-size:1.6rem; margin:6px 0 8px;}
  .sub{color:var(--ink-soft); font-size:0.95rem; margin-bottom:22px;}
  .tabs{display:flex; gap:6px; background:var(--paper); border-radius:12px; padding:4px; margin-bottom:24px;}
  .tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:0.9rem; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .tab.active{background:var(--ink); color:#fff;}
  form{display:none;}
  form.active{display:block;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;}
  .field input, .field select{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); font-family:'Inter',sans-serif; font-size:0.95rem; background:var(--paper); color:var(--ink);}
  .field input:focus, .field select:focus{outline:3px solid var(--sun); border-color:transparent;}
  .btn{width:100%; display:inline-block; padding:13px 24px; border-radius:100px; font-size:0.95rem; font-weight:700; text-decoration:none; cursor:pointer; border:none; background:var(--coral); color:#fff; text-align:center;}
  .btn:hover{background:var(--coral-dark);}
  .btn[disabled]{opacity:0.6; cursor:default;}
  .msg{margin-top:16px; padding:12px 14px; border-radius:12px; font-size:0.88rem; display:none;}
  .msg.error{display:block; background:var(--red-tint); color:var(--red);}
  .msg.info{display:block; background:var(--sky-tint); color:var(--ink);}
  .footer-links{margin-top:22px; text-align:center; font-size:0.88rem; color:var(--ink-soft);}
  .footer-links a{color:var(--coral); text-decoration:underline;}
  .forgot-link{text-align:center; font-size:0.85rem; margin-top:12px;}
  .forgot-link a{color:var(--ink-soft); text-decoration:underline;}
  footer{border-top:1px solid var(--line); padding:24px 28px; text-align:center; font-size:0.85rem; color:var(--ink-soft);}
  footer a{color:var(--ink); text-decoration:underline;}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">
    <img src="assets/trevqio-icon.png" alt="">
    Trevqio Agency
  </a>
</header>

<main>
  <div class="card">
    <h1>Client login</h1>
    <p class="sub">Sign in to choose your plan and start submitting work.</p>

    <div class="tabs">
      <div class="tab active" data-tab="signin">Sign in</div>
      <div class="tab" data-tab="signup">Create account</div>
    </div>

    <form id="signin-form" class="active">
      <div class="field"><label for="si-email">Email</label><input id="si-email" type="email" required></div>
      <div class="field"><label for="si-password">Password</label><input id="si-password" type="password" required></div>
      <button class="btn" type="submit">Sign in</button>
      <p class="forgot-link"><a href="#" id="forgot-toggle">Forgot password?</a></p>
    </form>

    <form id="forgot-form">
      <p class="sub" style="margin-bottom:16px;">Enter your email and we'll send you a link to set a new password.</p>
      <div class="field"><label for="fp-email">Email</label><input id="fp-email" type="email" required></div>
      <button class="btn" type="submit">Send reset link</button>
      <p class="forgot-link"><a href="#" id="forgot-back">Back to sign in</a></p>
    </form>

    <form id="signup-form">
      <div class="field"><label for="su-email">Email</label><input id="su-email" type="email" required></div>
      <div class="field"><label for="su-password">Password (6+ characters)</label><input id="su-password" type="password" required minlength="6"></div>
      <div class="field">
        <label for="su-plan">Choose your plan</label>
        <select id="su-plan">
          <option value="7-day free trial">7-Day Trial — Free</option>
          <option value="Trevqio Growth — ₦130,000/month">Trevqio Growth — ₦130,000/month</option>
          <option value="Trevqio Scale — ₦260,000/month">Trevqio Scale — ₦260,000/month</option>
          <option value="Custom Automation — ₦380,000/month">Custom Automation — ₦380,000/month</option>
        </select>
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>

    <div id="msg" class="msg"></div>
    <p class="footer-links">Just browsing? <a href="index.html">Back to homepage</a></p>
  </div>
</main>

<footer>
  <a href="index.html">Trevqio Agency</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_EMAIL } from './supabase-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msg = document.getElementById('msg');
  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg ' + type; }

  const params = new URLSearchParams(window.location.search);
  const planParam = params.get('plan');
  if (planParam){
    const select = document.getElementById('su-plan');
    const match = Array.from(select.options).find(o => o.value === planParam);
    if (match) select.value = planParam;
    document.querySelector('.tab[data-tab="signup"]').click();
  }

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('form').forEach(f=>f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + '-form').classList.add('active');
      msg.className = 'msg';
    });
  });

  document.getElementById('forgot-toggle').addEventListener('click', (e)=>{
    e.preventDefault();
    document.getElementById('signin-form').classList.remove('active');
    document.getElementById('forgot-form').classList.add('active');
    msg.className = 'msg';
  });
  document.getElementById('forgot-back').addEventListener('click', (e)=>{
    e.preventDefault();
    document.getElementById('forgot-form').classList.remove('active');
    document.getElementById('signin-form').classList.add('active');
    msg.className = 'msg';
  });
  document.getElementById('forgot-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    showMsg('Sending reset link…', 'info');
    const { error } = await supabase.auth.resetPasswordForEmail(
      document.getElementById('fp-email').value,
      { redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'reset-password.html') }
    );
    if (error){ showMsg(error.message, 'error'); return; }
    showMsg('Check your email for a link to reset your password.', 'info');
  });

  async function routeAfterAuth(user){
    if (user.email === ADMIN_EMAIL){ window.location.href = 'admin.html'; return; }
    const { data: teamAdmin } = await supabase.from('team_admins').select('uid').eq('uid', user.id).maybeSingle();
    if (teamAdmin){ window.location.href = 'admin.html'; return; }
    const { data: profile } = await supabase.from('profiles').select('uid').eq('uid', user.id).maybeSingle();
    window.location.href = profile ? 'dashboard.html' : 'plan.html';
  }

  document.getElementById('signin-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    showMsg('Signing in…', 'info');
    const { data, error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('si-email').value,
      password: document.getElementById('si-password').value
    });
    if (error){ showMsg(error.message, 'error'); return; }
    await routeAfterAuth(data.user);
  });

  document.getElementById('signup-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    showMsg('Creating your account…', 'info');
    const chosenPlan = document.getElementById('su-plan').value;
    const { data, error } = await supabase.auth.signUp({
      email: document.getElementById('su-email').value,
      password: document.getElementById('su-password').value
    });
    if (error){ showMsg(error.message, 'error'); return; }
    if (!data.session){
      showMsg('Account created — check your email to confirm it, then sign in to continue.', 'info');
      return;
    }
    const { error: fnError } = await supabase.functions.invoke('record-signup', { body: { plan: chosenPlan } });
    if (fnError){ showMsg('Account created, but setup failed: ' + fnError.message, 'error'); return; }
    window.location.href = 'dashboard.html';
  });

  supabase.auth.getUser().then(({ data: { user } })=>{
    if (!user) return;
    const dest = user.email === ADMIN_EMAIL ? 'admin.html' : null;
    const card = document.querySelector('.card');
    const banner = document.createElement('div');
    banner.className = 'msg info';
    banner.style.display = 'block';
    banner.innerHTML = `You're already signed in as <strong>${user.email}</strong>. `
      + `<a href="#" id="continue-as" style="text-decoration:underline;">Continue</a> or `
      + `<a href="#" id="switch-account" style="text-decoration:underline;">sign out to use a different account</a>.`;
    card.prepend(banner);
    document.querySelectorAll('.tabs, form').forEach(el => el.style.display = 'none');
    document.getElementById('continue-as').addEventListener('click', async (e)=>{
      e.preventDefault();
      await routeAfterAuth(user);
    });
    document.getElementById('switch-account').addEventListener('click', async (e)=>{
      e.preventDefault();
      await supabase.auth.signOut();
      window.location.reload();
    });
  });
</script>

</body>
</html>
