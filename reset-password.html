<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Trevqio Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFBF3; --ink:#231A33; --coral:#FF6B4A; --coral-dark:#E8502F;
    --sky:#2FA9D6; --sky-tint:#E4F5FB; --sun:#FFC94A;
    --line:#EFE6D6; --ink-soft:#5B5468; --red:#D64545; --red-tint:#FCEAEA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6; min-height:100vh; display:flex; flex-direction:column;}
  header.site{padding:20px 28px; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-size:1.15rem; font-weight:700; text-decoration:none; color:var(--ink);}
  .brand img{height:30px; width:30px; border-radius:9px; object-fit:cover;}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .card{width:100%; max-width:420px; background:#fff; border:2px solid var(--ink); border-radius:22px; padding:36px 32px;}
  h1{font-family:'Baloo 2',sans-serif; font-size:1.5rem; margin:0 0 8px;}
  .sub{color:var(--ink-soft); font-size:0.95rem; margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;}
  .field input{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); font-family:'Inter',sans-serif; font-size:0.95rem; background:var(--paper); color:var(--ink);}
  .field input:focus{outline:3px solid var(--sun); border-color:transparent;}
  .btn{width:100%; display:inline-block; padding:13px 24px; border-radius:100px; font-size:0.95rem; font-weight:700; text-decoration:none; cursor:pointer; border:none; background:var(--coral); color:#fff; text-align:center;}
  .btn:hover{background:var(--coral-dark);}
  .btn[disabled]{opacity:0.6; cursor:default;}
  .msg{margin-top:16px; padding:12px 14px; border-radius:12px; font-size:0.88rem; display:none;}
  .msg.error{display:block; background:var(--red-tint); color:var(--red);}
  .msg.info{display:block; background:var(--sky-tint); color:var(--ink);}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">
    <img src="assets/trevqio-icon.png" alt="">
    Trevqio Agency
  </a>
</header>

<main>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="sub" id="sub-text">Enter a new password for your account.</p>

    <form id="reset-form">
      <div class="field"><label for="new-password">New password (6+ characters)</label><input id="new-password" type="password" required minlength="6"></div>
      <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" required minlength="6"></div>
      <button class="btn" type="submit">Save new password</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msg = document.getElementById('msg');
  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg ' + type; }

  // Supabase reads the recovery token from the URL automatically.
  // Confirm we actually have a valid recovery session before letting them submit.
  let hasRecoverySession = false;
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')){
      hasRecoverySession = true;
    }
  });
  setTimeout(async ()=>{
    const { data: { session } } = await supabase.auth.getSession();
    if (session) hasRecoverySession = true;
    if (!hasRecoverySession){
      showMsg('This reset link is invalid or has expired. Go back to the login page and request a new one.', 'error');
      document.getElementById('reset-form').style.display = 'none';
    }
  }, 1200);

  document.getElementById('reset-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pw = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if (pw !== confirm){ showMsg("Passwords don't match.", 'error'); return; }
    showMsg('Saving…', 'info');
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error){ showMsg(error.message, 'error'); return; }
    showMsg('Password updated! Redirecting you to sign in…', 'info');
    await supabase.auth.signOut();
    setTimeout(()=>{ window.location.href = 'login.html'; }, 1500);
  });
</script>

</body>
</html>
